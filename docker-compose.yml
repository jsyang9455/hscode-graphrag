services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hscode
      POSTGRES_PASSWORD: hscode
      POSTGRES_DB: hscode_graphrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hscode -d hscode_graphrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://hscode:hscode@db:5432/hscode_graphrag
      CORS_ORIGINS: http://localhost:3000,http://localhost,http://frontend
      THETA_HIGH: "0.75"
      USE_LLM: ${USE_LLM:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./orchestration/artifacts:/app/orchestration/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://hscode:hscode@db:5432/hscode_graphrag
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "orchestration.run_pipeline"]
    profiles: ["batch"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./docs:/app/docs
      - ./orchestration/artifacts:/app/orchestration/artifacts

volumes:
  pgdata:
